<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แดชบอร์ดงานโภชนาการ · โรงพยาบาลเทพา</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#f6f8f7;--card:#fff;--text:#1f2924;--muted:#6b7670;--border:#e5eae7;--green:#2d7a4f;--green-dark:#23613e;--green-light:#e9f5ee;--green-tint:#eef7f1;--amber:#d99b26;--blue:#4285c4;--purple:#7e57c2;--coral:#d9634c;--shadow:0 2px 10px rgba(24,48,35,.06);--radius:16px}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Noto Sans Thai','Sarabun',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
    .container{max-width:1120px;margin:0 auto;padding:18px 16px 48px}
    .utility-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
    .sync-badge{background:#fff;border:1px solid var(--border);padding:6px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
    .sync-badge.ok{border-color:#b7dfc7;background:var(--green-light);color:var(--green-dark)}
    .sync-badge.err{border-color:#ebb5ad;background:#fdf2f0;color:#b83b2d}
    .util-actions{display:flex;gap:8px;flex-wrap:wrap}
    .util-btn{background:#fff;border:1px solid var(--border);color:var(--muted);padding:6px 11px;border-radius:10px;font-size:13px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
    .util-btn:hover{border-color:var(--green);color:var(--green);background:var(--green-light)}
    .banner{background:linear-gradient(120deg,#246842 0%,#3a8d5e 55%,#65bd88 100%);border-radius:18px;padding:22px 26px;color:#fff;display:flex;align-items:center;gap:18px;box-shadow:0 6px 18px rgba(45,122,79,.22);margin-bottom:18px}
    .banner-icon{width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
    .banner h1{margin:0;font-size:23px;font-weight:700}
    .banner p{margin:2px 0 0;font-size:15px;opacity:.92}
    .main-tabs,.sub-tabs{background:#fff;border-radius:16px;padding:6px;display:grid;gap:6px;box-shadow:var(--shadow);margin-bottom:18px}
    .main-tabs{grid-template-columns:repeat(3,1fr)}
    .sub-tabs{grid-template-columns:1fr 1fr;border-radius:14px;padding:5px}
    .tab-btn,.sub-tab-btn{border:none;background:transparent;padding:11px 10px;border-radius:12px;font-family:inherit;font-size:15px;font-weight:500;color:var(--muted);cursor:pointer}
    .tab-btn.active,.sub-tab-btn.active{background:var(--green);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(45,122,79,.22)}
    .date-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
    .date-pill-wrap{position:relative;display:inline-flex;align-items:center}
    .date-pill{background:#fff;border:1px solid #d7dfda;border-radius:10px;padding:7px 14px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
    .native-date-input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
    .date-nav-btn{background:#fff;border:1px solid #d7dfda;border-radius:10px;padding:7px 11px;font-family:inherit;font-size:14px;color:var(--muted);cursor:pointer}
    .date-nav-btn:hover{border-color:var(--green);color:var(--green)}
    .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
    .kpi-card{background:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border-left:4px solid var(--green);display:flex;justify-content:space-between;align-items:flex-start;min-height:92px}
    .kpi-card.amber{border-left-color:var(--amber)}
    .kpi-card.blue{border-left-color:var(--blue)}
    .kpi-card.purple{border-left-color:var(--purple)}
    .kpi-card.solid-green{background:var(--green);border-left-color:var(--green);color:#fff}
    .kpi-val{font-size:30px;font-weight:700;line-height:1.15;margin-bottom:4px}
    .kpi-card.green-text .kpi-val{color:var(--green)}
    .kpi-card.amber .kpi-val{color:var(--amber)}
    .kpi-card.blue .kpi-val{color:var(--blue)}
    .kpi-card.purple .kpi-val{color:var(--purple)}
    .kpi-label{font-size:13px;color:var(--muted)}
    .kpi-card.solid-green .kpi-label{color:rgba(255,255,255,.9)}
    .kpi-icon{font-size:22px;line-height:1}
    .card{background:var(--card);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px}
    .card-title{font-size:17px;font-weight:700;margin:0 0 16px;display:flex;align-items:center;gap:10px}
    .card-title::before{content:'';width:4px;height:18px;border-radius:4px;background:var(--green);display:inline-block}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:15px}
    th{text-align:left;color:var(--muted);font-weight:500;font-size:14px;padding:10px 12px;border-bottom:1px solid var(--border)}
    th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
    td{padding:12px;border-bottom:1px solid #f0f3f1}
    tbody tr:nth-child(even){background:var(--green-tint)}
    tbody tr:last-child td{border-bottom:none}
    tr.total-row td{background:var(--green-tint)!important;font-weight:700;border-top:1px solid #d5e6dc;border-bottom:none}
    .meal-input{width:92px;padding:8px 10px;border:1px solid #d5ddd8;border-radius:10px;background:#f5f7f6;text-align:right;font-family:inherit;font-size:15px;font-variant-numeric:tabular-nums}
    .meal-input:focus{outline:none;border-color:var(--green);background:#fff}
    textarea.note-box{width:100%;min-height:74px;border:1px solid #d5ddd8;border-radius:12px;padding:10px 12px;font-family:inherit;font-size:14px;background:#fafcfb}
    .btn-row{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
    .btn-primary{background:var(--green);color:#fff;border:none;border-radius:12px;padding:11px 22px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
    .btn-primary:hover{background:var(--green-dark)}
    .btn-danger-outline{background:#fff;color:#c94132;border:1px solid #d9776c;border-radius:12px;padding:10px 18px;font-family:inherit;font-size:15px;cursor:pointer}
    .btn-soft{background:var(--green-light);color:var(--green-dark);border:1px solid #c7e3d2;border-radius:10px;padding:8px 14px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
    .helper-text{font-size:14px;color:var(--muted)}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
    .sub-heading{font-size:16px;font-weight:600;margin:0 0 14px}
    .donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
    .donut-svg-box{position:relative;width:176px;height:176px;flex-shrink:0}
    .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
    .donut-center .big{font-size:26px;font-weight:700;line-height:1.1}
    .donut-center .small{font-size:12px;color:var(--muted)}
    .legend-list{flex:1;min-width:190px;display:flex;flex-direction:column;gap:9px}
    .legend-item{display:grid;grid-template-columns:12px 1fr auto auto;align-items:center;gap:10px;font-size:14px}
    .dot{width:12px;height:12px;border-radius:4px;display:inline-block}
    .legend-val{font-weight:700;text-align:right;min-width:30px}
    .legend-pct{color:var(--muted);text-align:right;min-width:38px}
    .hbar-list{display:flex;flex-direction:column;gap:12px}
    .hbar-row{display:grid;grid-template-columns:165px 1fr;align-items:center;gap:14px}
    .hbar-row.compact{grid-template-columns:140px 1fr;gap:10px}
    .hbar-label{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hbar-row.compact .hbar-label{font-size:12px}
    .hbar-track{display:flex;align-items:center;gap:10px}
    .hbar-fill{height:24px;border-radius:6px;background:var(--green);min-width:2px}
    .hbar-row.compact .hbar-fill{height:14px;border-radius:4px}
    .hbar-num{font-size:14px;font-weight:500}
    .hbar-row.compact .hbar-num{font-size:12px}
    .chart-legend{display:flex;gap:16px;margin-bottom:14px;font-size:13px}
    .chart-legend span{display:inline-flex;align-items:center;gap:6px}
    .stacked-grid{display:flex;align-items:flex-end;gap:8px;height:220px;padding-top:28px;border-bottom:1px solid #eef2ef}
    .stacked-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;min-width:18px}
    .stacked-total{font-size:13px;font-weight:500;margin-bottom:4px}
    .stacked-bars{width:100%;max-width:54px;display:flex;flex-direction:column-reverse;overflow:hidden;border-radius:4px 4px 0 0}
    .stacked-bars.wide{max-width:none}
    .seg-b{background:var(--green)}.seg-l{background:var(--amber)}.seg-d{background:var(--blue)}
    .stacked-day{margin-top:8px;font-size:13px;color:var(--muted)}
    .stacked-day.selected{color:var(--green);font-weight:700}
    .divider{border:none;border-top:1px solid var(--border);margin:20px 0 16px}
    .note-list{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px;font-size:15px}
    .staff-edit-row{display:grid;grid-template-columns:1fr auto 220px;gap:12px;align-items:center;padding:12px;border-bottom:1px solid #f0f3f1}
    .staff-edit-row:nth-child(even){background:var(--green-tint)}
    .status-toggle{display:inline-flex;background:#edf1ef;padding:4px;border-radius:10px;gap:4px}
    .status-btn{border:none;background:transparent;padding:6px 14px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
    .status-btn.present.active{background:var(--green);color:#fff}
    .status-btn.absent.active{background:var(--coral);color:#fff}
    .reason-input{width:100%;padding:8px 10px;border:1px solid #d5ddd8;border-radius:9px;font-family:inherit;font-size:14px;background:#fff}
    .reason-input:disabled{background:#f3f5f4;color:#aaa}
    .staff-chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .staff-chip{background:var(--green-light);color:var(--green-dark);padding:6px 12px;border-radius:20px;font-size:13px;display:inline-flex;align-items:center;gap:8px}
    .staff-chip button{border:none;background:none;color:#c94132;font-weight:700;cursor:pointer;font-size:14px}
    .range-bar{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
    .range-field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
    .toast{position:fixed;bottom:24px;right:24px;background:#1f2924;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translateY(12px);pointer-events:none;transition:all .25s;z-index:999}
    .toast.show{opacity:1;transform:translateY(0)}
    .hidden{display:none!important}
    @media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.staff-edit-row{grid-template-columns:1fr;gap:8px}.hbar-row{grid-template-columns:120px 1fr}}
    @media(max-width:520px){.kpi-grid{grid-template-columns:1fr}.tab-btn{font-size:13px;padding:10px 6px}.meal-input{width:70px}}
  </style>
</head>
<body>
  <div class="container">
    <div class="utility-bar">
      <span class="sync-badge" id="sync-status-badge">⏳ กำลังเชื่อมต่อ Google Sheets...</span>
      <div class="util-actions">
        <button class="util-btn" onclick="pullFromGoogleSheet(true)">🔄 ดึงจาก Sheet</button>
        <button class="util-btn" onclick="pushToGoogleSheet(true)">📤 ส่งขึ้น Sheet</button>
        <button class="util-btn" onclick="exportJSON()">💾 สำรอง JSON</button>
        <label class="util-btn" style="margin:0;">📂 นำเข้า JSON<input type="file" accept=".json" style="display:none" onchange="importJSON(event)" /></label>
        <button class="util-btn" onclick="resetDemoData()">🗑️ รีเซ็ตตัวอย่าง</button>
      </div>
    </div>

    <header class="banner">
      <div class="banner-icon">🥗</div>
      <div><h1>แดชบอร์ดงานโภชนาการ</h1><p>โรงพยาบาลเทพา</p></div>
    </header>

    <nav class="main-tabs">
      <button class="tab-btn active" id="tab-btn-dashboard" onclick="switchMainTab('dashboard')">1. แดชบอร์ด</button>
      <button class="tab-btn" id="tab-btn-entry" onclick="switchMainTab('entry')">2. บันทึกข้อมูล</button>
      <button
